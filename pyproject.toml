[project]
name = "handball-match-analysis"
version = "0.3.0"
description = "POC: Handball match analysis — detection, tracking, team ID, pose (GPU), court mapping, state export"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "ultralytics>=8.1.0",
    "scikit-learn>=1.4.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
]

[project.scripts]
detect = "detect:main"
analyze = "analyze:main"

[tool.uv]
# Use PyTorch's CUDA 12.1 index for GPU-enabled torch/torchvision
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
